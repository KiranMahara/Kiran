```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio v2 | Compiling</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'JetBrains Mono',monospace;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0d1117;
color:#c9d1d9;
overflow:hidden;
}

/* subtle grid background */
body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background-image:linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
background-size:50px 50px;
animation:gridMove 40s linear infinite;
}

@keyframes gridMove{
0%{transform:translate(0,0)}
100%{transform:translate(-200px,-200px)}
}

.container{
position:relative;
width:90%;
max-width:750px;
background:#161b22;
border-radius:12px;
padding:40px;
box-shadow:0 0 40px rgba(0,0,0,0.7);
border:1px solid #30363d;
}

.title{
font-size:22px;
margin-bottom:25px;
color:#58a6ff;
}

.terminal{
background:#0d1117;
border-radius:8px;
padding:25px;
border:1px solid #30363d;
font-size:14px;
line-height:1.7;
min-height:160px;
}

.cursor{
display:inline-block;
width:8px;
height:16px;
background:#58a6ff;
margin-left:5px;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:0}
50%{opacity:1}
100%{opacity:0}
}

/* progress bar */

.progress-container{
margin-top:30px;
background:#0d1117;
border-radius:10px;
overflow:hidden;
border:1px solid #30363d;
}

.progress-bar{
height:10px;
width:0%;
background:linear-gradient(90deg,#58a6ff,#3fb950);
animation:load 10s linear forwards;
}

@keyframes load{
0%{width:0%}
100%{width:100%}
}

.status{
margin-top:12px;
font-size:13px;
opacity:0.7;
}

.footer{
margin-top:25px;
font-size:12px;
opacity:0.5;
text-align:center;
}

@media(max-width:600px){
.container{
padding:25px;
}
}

</style>
</head>

<body>

<div class="container">

<div class="title">$ compiling portfolio_v2...</div>

<div class="terminal" id="terminal"></div>

<div class="progress-container">
<div class="progress-bar"></div>
</div>

<div class="status">Building something awesome...</div>

<div class="footer">
© 2026 | Kiran Mahara
</div>

</div>

<script>

const lines = [
"> Initializing project...",
"> Loading components...",
"> Optimizing performance...",
"> Building UI modules...",
"> Connecting backend...",
"> Running final checks...",
"> Portfolio v2 launching soon..."
];

let i = 0;
const terminal = document.getElementById("terminal");

function typeLine(){
if(i < lines.length){
let line = document.createElement("div");
line.textContent = lines[i];
terminal.appendChild(line);
i++;
setTimeout(typeLine,800);
}
}

typeLine();

</script>

</body>
</html>
```
