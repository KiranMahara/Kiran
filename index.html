<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiran Mahara | Portfolio v2 Booting</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'JetBrains Mono',monospace;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#020409;
color:#e6edf3;
overflow:hidden;
}

/* MATRIX BACKGROUND */

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
opacity:.25;
}

/* MAIN CARD */

.container{
position:relative;
z-index:2;
width:90%;
max-width:800px;
background:#0d1117;
border:1px solid #30363d;
border-radius:14px;
padding:40px;
box-shadow:0 0 40px rgba(0,0,0,.8);
}

/* TITLE */

.title{
color:#58a6ff;
font-size:22px;
margin-bottom:25px;
}

/* TERMINAL */

.terminal{
background:#010409;
border:1px solid #30363d;
border-radius:8px;
padding:25px;
height:220px;
overflow:hidden;
font-size:14px;
line-height:1.7;
}

/* CURSOR */

.cursor{
display:inline-block;
width:8px;
height:15px;
background:#58a6ff;
margin-left:5px;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:0}
50%{opacity:1}
100%{opacity:0}
}

/* PROGRESS */

.progress-wrap{
margin-top:25px;
}

.progress-bar{
height:12px;
background:#010409;
border-radius:10px;
border:1px solid #30363d;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#58a6ff,#3fb950);
transition:width .3s;
}

.percent{
margin-top:8px;
font-size:13px;
opacity:.7;
}

.footer{
margin-top:25px;
font-size:12px;
opacity:.5;
text-align:center;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

<div class="title">$ booting portfolio_v2...</div>

<div class="terminal" id="terminal"></div>

<div class="progress-wrap">

<div class="progress-bar">
<div class="bar" id="bar"></div>
</div>

<div class="percent" id="percent">0%</div>

</div>

<div class="footer">
Portfolio v2 launching soon • © 2026 Kiran Mahara
</div>

</div>

<script>

/* MATRIX EFFECT */

const canvas = document.getElementById("matrix")
const ctx = canvas.getContext("2d")

canvas.height = window.innerHeight
canvas.width = window.innerWidth

const letters = "01"
const fontSize = 14
const columns = canvas.width/fontSize

const drops = []

for(let x=0;x<columns;x++)
drops[x]=1

function draw(){

ctx.fillStyle="rgba(2,4,9,0.05)"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="#0f0"
ctx.font=fontSize+"px monospace"

for(let i=0;i<drops.length;i++){

const text = letters.charAt(Math.floor(Math.random()*letters.length))

ctx.fillText(text,i*fontSize,drops[i]*fontSize)

if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
drops[i]=0

drops[i]++

}

}

setInterval(draw,33)

/* TERMINAL TYPING */

const lines=[
"> Starting Kiran Mahara portfolio system...",
"> Loading UI modules...",
"> Optimizing animations...",
"> Connecting GitHub API...",
"> Building developer experience...",
"> Running final tests...",
"> Portfolio v2 launching soon..."
]

const terminal=document.getElementById("terminal")

let index=0

function addLine(){

if(index<lines.length){

const div=document.createElement("div")
div.textContent=lines[index]

terminal.appendChild(div)

terminal.scrollTop=terminal.scrollHeight

index++

setTimeout(addLine,900)

}

}

addLine()

/* PROGRESS BAR */

let progress=0

const bar=document.getElementById("bar")
const percent=document.getElementById("percent")

function load(){

progress++

bar.style.width=progress+"%"
percent.innerText=progress+"%"

if(progress<100)
setTimeout(load,120)

}

load()

</script>

</body>
</html>
